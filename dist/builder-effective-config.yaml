directories:
  output: dist
  buildResources: build
appId: com.jarfi.noc
productName: JARFI NOC
publish:
  - provider: github
    owner: abadijayacopier
    repo: jarfi
win:
  target: nsis
  icon: public/icon.ico
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: JARFI NOC
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  runAfterFinish: true
  include: build/installer.nsh
extraResources:
  - from: extraResources/mariadb
    to: mariadb
    filter:
      - '**/*'
  - from: scripts/setup-jarfi-db.bat
    to: mariadb/setup-jarfi-db.bat
files:
  - filter:
      - electron/**/*
      - public/**/*
      - .next/standalone/**/*
      - .next/static/**/*
      - schema.sql
      - package.json
      - build/installer.nsh
asarUnpack:
  - .next/standalone/**/*
  - schema.sql
electronVersion: 42.0.1
